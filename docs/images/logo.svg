<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" class="ni-netsuicon" data-click="press"><style>@keyframes ni-netsuicon-arrive-frame-draw{0%{stroke-dashoffset:1;animation-timing-function:ease-in-out}60%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}@keyframes ni-netsuicon-arrive-play-scale{0%{scale:0}50%{scale:0;animation-timing-function:cubic-bezier(0.34,1.56,0.64,1)}90%{scale:1}100%{scale:1}}@keyframes ni-netsuicon-nudge-play-translate{0%{translate:0px 0px;animation-timing-function:ease-out}40%{translate:36px 0px;animation-timing-function:ease-in-out}100%{translate:0px 0px}}@keyframes ni-netsuicon-press-play-scale{0%{scale:1;animation-timing-function:ease-out}15%{scale:0.8;animation-timing-function:cubic-bezier(0.34,1.56,0.64,1)}55%{scale:1.15;animation-timing-function:ease-in-out}100%{scale:1}}@keyframes ni-netsuicon-press-frame-rotate{0%{rotate:0deg}15%{rotate:0deg;animation-timing-function:ease-in-out}85%{rotate:90deg}100%{rotate:90deg}}.ni-netsuicon .n-frame{animation:ni-netsuicon-arrive-frame-draw 1100ms linear 0ms 1 both}.ni-netsuicon .n-play{animation:ni-netsuicon-arrive-play-scale 1100ms linear 0ms 1 both}.ni-netsuicon:hover .n-play{animation:ni-netsuicon-nudge-play-translate 500ms linear 0ms 1 both}.ni-netsuicon:active .n-play{animation:ni-netsuicon-press-play-scale 800ms linear 0ms 1 both}.ni-netsuicon:active .n-frame{animation:ni-netsuicon-press-frame-rotate 800ms linear 0ms 1 both}.ni-netsuicon[data-quiet]:hover .n-play{animation:none}.ni-netsuicon[data-play~="nudge"] .n-play{animation:ni-netsuicon-nudge-play-translate 500ms linear 0ms 1 both}.ni-netsuicon[data-play~="press"] .n-play{animation:ni-netsuicon-press-play-scale 800ms linear 0ms 1 both}.ni-netsuicon[data-play~="press"] .n-frame{animation:ni-netsuicon-press-frame-rotate 800ms linear 0ms 1 both}@media (prefers-reduced-motion:reduce){.ni-netsuicon *{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important}}</style><defs><linearGradient id="ni-netsuicon-plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b6bff"/><stop offset="1" stop-color="#4f86f7"/></linearGradient></defs><rect x="64" y="64" width="896" height="896" rx="208" fill="url(#ni-netsuicon-plate)"/><rect x="264" y="264" width="496" height="496" rx="120" fill="none" stroke="#ffffff" stroke-width="60" stroke-linecap="round" stroke-linejoin="round" class="n-frame" style="transform-box:view-box;transform-origin:512px 512px" pathLength="1" stroke-dasharray="1 2" stroke-dashoffset="0"/><path d="M458 418 L458 606 L618 512 Z" fill="#ffffff" stroke="#ffffff" stroke-width="44" stroke-linejoin="round" class="n-play" style="transform-box:view-box;transform-origin:512px 512px"/></svg>